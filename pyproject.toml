[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-kill-switch-suite"
version = "1.0.0"
description = "Fail-closed kill-switch primitives for autonomous agent fleets"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
slack = ["slack-bolt>=1.18", "requests>=2.31"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
